[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tooling and reconstruction for Stunt Island (1992) film, scene and model formats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neilsh/stunt-reel"
homepage = "https://github.com/neilsh/stunt-reel"
readme = "README.md"
publish = false

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
clone_on_ref_ptr = "warn"
match_wildcard_for_single_variants = "warn"
uninlined_format_args = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Full debug info put 14.4 GB in `target/debug`, paid once per worktree.
# Line tables still symbolise a backtrace down to the line.
[profile.dev]
debug = "line-tables-only"
