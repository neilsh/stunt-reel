# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews pull requests as a second reader, never as a second gate: the gate
# (`mise run check`) and a person decide whether a pull request merges, and a comment here is
# advice (see CONTRIBUTING.md). Everything this file does not mention stays at CodeRabbit's
# default; the entries below exist only where a default cannot say it.

reviews:
  # Three paths where a review comment cannot be useful: two lockfiles and the synthetic fixture
  # bytes. And work/, whose dated records (work/README.md) a person reviews in the pull request
  # that adds them; a spec or plan, and a pull request that also changes research/ or NOTICE.md,
  # gets the fresh reviewer of AGENTS.md working rule 7.
  path_filters:
    - "!Cargo.lock"
    - "!uv.lock"
    - "!tests/fixtures/**"
    - "!work/**"

  # The docstring-coverage pre-merge check counts test functions, and this repository names a
  # test for what it checks instead of giving it a docstring (223 of 1114 have one), so the
  # check failed on any pull request that touched tests; it takes no path filter, and style is
  # the gate's job. Off.
  pre_merge_checks:
    docstrings:
      mode: "off"

  # Generated unit tests landed as a commit on the pull request's branch (#264, 2026-11-07),
  # failed clippy and the commit-message check, and could be fixed only by rewriting the
  # branch. Tests come from whoever owns the pull request
  # (work/2026-11/retro/retro-2026-11-07.md). Off.
  finishing_touches:
    unit_tests:
      enabled: false

  # The message posted while a review runs woke an agent watching the pull request with
  # nothing to do (four times on 2026-11-06).
  in_progress_fortune: false
  # The "Currently processing new changes" note in the walkthrough comment did the same on #397
  # (2026-11-11); the fortune switch does not cover it.
  review_status: false

  # Every pull request, whatever branch it targets. CodeRabbit's default is the repository's
  # default branch alone, so a stacked pull request whose base is a feature branch got no
  # automatic review at all. `.*` is a regex over base branch names, and the default branch
  # stays included: this widens the set rather than replacing it.
  auto_review:
    drafts: false
    base_branches:
      - ".*"

  path_instructions:
    - path: "crates/stunt-core/**"
      instructions: |
        `stunt-core` takes only small, pure-Rust dependencies — no I/O, windowing, GPU,
        audio or emulator crates ([I7] in AGENTS.md). Do not propose a new dependency
        without naming the invariant or seam it serves, and check Cargo.toml first.
        Node state is a flat `Vec<SodNode>` indexed by `NodeId(u32)` ([I2]); do not suggest
        `Rc<RefCell<_>>`.
    - path: "research/**"
      instructions: |
        These are the analysis notes, and their rules are not ordinary markdown style.
        Review structure, internal links, anchors and evidentiary tiers, and flag a claim
        that restates a definition owned elsewhere. Do not try to verify a fact about
        PLAYONE.EXE or a byte layout: that needs the binary and the corpus, and a review
        comment is not evidence.
    - path: "docs/adr/**"
      instructions: |
        An ADR records a decision already made: context, the decision, the options rejected
        and why, and the consequences. Review for a missing rejected option or consequence,
        not for whether the decision was right, and do not propose rewording an accepted
        ADR's decision.
    - path: "python/**"
      instructions: |
        Linting and typing are the gate's job (`ruff check`, `ruff format --check`, strict
        `mypy`); do not restate them as review comments. The project requires Python 3.15
        (`requires-python` in pyproject.toml), so `lazy import x` and `lazy from x import y`
        (PEP 810 lazy imports) are valid syntax, not errors. Prefer the standard library and
        the dependencies already declared in pyproject.toml. A script under python/scripts/
        reaches people through `mise run`, so a new one needs a task in mise.toml.

# AGENTS.md is read automatically; SPEC.md owns the invariants it cites and GLOSSARY.md the
# vocabulary it uses, and neither is on CodeRabbit's default guideline list.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "AGENTS.md, docs/SPEC.md, GLOSSARY.md"
        applyTo: "**"
