# Game data for cloud sessions, in the private R2 bucket (work/2026-11/cloud-assets/spec.md, ADR 0039).
# `mise run cloud-assets -- pack` rewrites the key, sha256, bytes and references lines.
# `on_demand = true` leaves an archive out of a command given no names (the session-start
# fetch, verify, pack, upload): only naming it covers it (ADR 0039).
bucket = "stunt-reel-internal-assets"
version = "v2"

[corpus-stuntisl]
into = "corpus/stuntisl"
include = ["**"]
exclude = ["RES/MUSIC?.ESS", "RES/MUSIC?.XMI", "RES/MUSIC?.XMM", "RES/MUSIC?.XMP"]
key = "v2/corpus-stuntisl-5af881be852308ae.tar.zst"
sha256 = "5af881be852308aec91fa42f88732f4360b6d4f200ae1fba57ea2e5a948f396a"
bytes = 5295151

