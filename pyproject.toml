[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "stunt-reel"
dynamic = ["version"]
description = "Tooling, automation, and analysis environment for Stunt Island film reels and game executables"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Stunt Reel Contributors" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/neilsh/stunt-reel"
Repository = "https://github.com/neilsh/stunt-reel"
Issues = "https://github.com/neilsh/stunt-reel/issues"

[dependency-groups]
dev = [
    "iced-x86>=1.22.0",  # 16-bit x86 decode for python/scripts/build_pairing.py (ADR 0033)
    "kaitaistruct==0.11",
    "mypy>=1.14.0",
    "numpy>=2.5",
    "pillow>=13",
    "psutil>=7.2.2",  # xdist's -n auto counts physical cores (ADR 0031)
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.1",  # TC001-TC003 write `lazy` imports at py315 (extend-safe-fixes below)
]

[tool.hatch.version]
path = "python/stunt_reel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/stunt_reel"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["python", "tests"]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "corpus",
    "target",
]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: prevent shadowing Python built-ins
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez: require timezone-aware datetimes
    "G",      # flake8-logging-format: validate logging interpolation
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie bug-pattern checks
    "T10",    # flake8-debugger: forbid leftover debugger calls
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "PT",     # flake8-pytest-style
    "ARG",    # flake8-unused-arguments
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "BLE",    # flake8-blind-except: no bare `except Exception`
    "FURB",   # refurb: modern idioms
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "PERF",   # perflint
    "PGH",    # pygrep-hooks: blanket `noqa` / `type: ignore`
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "TC",     # flake8-type-checking: typing-only imports become `lazy` imports
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops: exception handling (TRY003 is out, below)
    "YTT",    # flake8-2020
    "PLC",    # pylint conventions
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PYI",    # flake8-pyi: typing idioms that also apply outside stubs
    "ERA",    # eradicate: commented-out code
    "FLY",    # flynt: `str.join` of literals as an f-string
    "EXE",    # flake8-executable: shebangs match the executable bit
    "ASYNC",  # flake8-async
    "SLOT",   # flake8-slots: `__slots__` on str, tuple and namedtuple subclasses
    "TD",     # flake8-todos: a TODO names its author and links its issue
]
# Deliberately NOT selected (checked 2026-10-29; counts are violations at the time):
#   D       pydocstyle: ~370 hits (248 undocumented public functions, 98 imperative-mood);
#           the docs live in docs/ and research/, not docstrings.
#   ANN     annotations: ANN401 flags 60 `Any`s at JSON/Kaitai boundaries; mypy strict
#           already requires every annotation.
#   EM/TRY003  exception-message style: ~240 hits, no bug class behind them.
#   PLR     magic values and size limits (PLR2004 ~196, branches/arguments ~35): noisy
#           for byte-format code where the numbers are the spec.
#   COM812  conflicts with `ruff format`.
#   INP001  scripts are not packages.
#   SLF001  tests and tools reach into private members on purpose.
# Checked 2026-11-03 (#161) and also left out:
#   FBT     boolean positional arguments: 21 hits, mostly test helpers and CLI flags.
#   C90     McCabe complexity: 26 hits in byte-format dispatch that reads best as one match.
#   FIX     forbids TODO outright; TD keeps them but makes each one traceable.
ignore = [
    "E501",  # line length violations handled by ruff format
    "TRY003", # long exception messages: ~240 hits, see EM above
]
# A typing-only import is written `lazy from x import y` (PEP 810), the fix ruff offers at
# py315, so `mise run fix` applies it instead of the gate failing on it. Ruff marks the fix
# unsafe because the import's side effects move to first use, which nothing here relies on.
# A lazy import still resolves if something evaluates the annotation at runtime, where a
# name under `if TYPE_CHECKING:` raises NameError; existing blocks convert when touched.
# TID255 undoes one: an import made lazy that a later edit uses at module level turns eager
# again, which `fix` would otherwise leave for lint to fail on.
extend-safe-fixes = ["TC001", "TC002", "TC003", "TID255"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the assertion mechanism in tests
    "BLE001",  # tests catch broadly to record what escaped
    "PERF401", # clarity over speed in test setup
]
"python/scripts/**" = [
    "T20",     # CLI scripts write human-readable progress to stdout
    "BLE001",  # scripts turn any failure into a reported verdict
    "PERF401", # clarity over speed in one-shot tooling
]

"python/scripts/adversarial_formats_challenge.py" = [
    "PTH",     # one-off corpus probe written against open()/glob
    "PLC0415", # imports the corpus parser after extending sys.path
]

[tool.ruff.lint.isort]
known-first-party = ["stunt_reel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.15"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true
# Optional error codes from the 2026-11-03 survey (#161); `deprecated` and `exhaustive-match`
# catch real drift, the rest keep narrowing and overrides honest.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "explicit-override",
    "mutable-override",
    "exhaustive-match",
    "deprecated",
]
mypy_path = "python"
files = ["python", "tests"]
exclude = ["corpus"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["python", "python/scripts"]
markers = [
    "windows: behaves differently on Windows; the pull-request Windows job runs only these (check-windows-smoke)",
    "docs: documentation tests; the gate's docs step runs them (test-py-docs)",
]

[tool.uv]
# A floor, not an exact pin. `mise.toml` pins the exact uv for local and CI runs; this
# refuses an older standalone uv. Renovate's `pep621` manager runs its own uv and stops
# with `tool_version_not_supported` at an exact pin, so the floor moves with mise's pin.
required-version = ">=0.13.1"
# uv's default `managed` preference downloads the newest interpreter the floor allows and
# runs the gate on that, not on the Python `mise.toml` installs: a fresh worktree on
# 2026-10 was running 3.14 against a 3.11 pin. `system` prefers the interpreter on PATH,
# so under `mise run`/`mise exec` uv runs the pinned one;
# tests/test_toolchain_pins.py fails when it does not.
python-preference = "system"
