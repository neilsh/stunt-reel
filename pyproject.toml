[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stunt-reel"
dynamic = ["version"]
description = "Tooling, automation, and analysis environment for Stunt Island film reels and game executables"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Stunt Reel Contributors" }
]
dependencies = []

[dependency-groups]
dev = [
    "kaitaistruct==0.11",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.version]
path = "python/stunt_reel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/stunt_reel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]
exclude = [
    ".agents",
    ".claude",
    ".git",
    ".venv",
    "build",
    "dist",
    "corpus",
    "target",
]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: prevent shadowing Python built-ins
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez: require timezone-aware datetimes
    "G",      # flake8-logging-format: validate logging interpolation
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie bug-pattern checks
    "T10",    # flake8-debugger: forbid leftover debugger calls
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "PT",     # flake8-pytest-style
    "ARG",    # flake8-unused-arguments
    "S",      # flake8-bandit
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line length violations handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # asserts are the assertion mechanism in tests
"python/scripts/**" = ["T20"]  # CLI scripts write human-readable progress to stdout

[tool.ruff.lint.isort]
known-first-party = ["stunt_reel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true
mypy_path = "python"
files = ["python", "tests"]
exclude = ["corpus"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["python"]
