[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stunt-reel"
version = "0.1.0"
description = "Tooling, automation, and analysis environment for Stunt Island film reels and game executables"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Stunt Reel Contributors" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/stunt_reel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]
exclude = [
    ".agents",
    ".git",
    ".venv",
    "build",
    "dist",
    "corpus",
    "target",
]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: prevent shadowing Python built-ins
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez: require timezone-aware datetimes
    "G",      # flake8-logging-format: validate logging interpolation
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie bug-pattern checks
    "T10",    # flake8-debugger: forbid leftover debugger calls
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length violations handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["stunt_reel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true
mypy_path = "python"
files = ["python", "tests"]
exclude = ["corpus"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["python"]
