[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "deny"
# ttf-parser is reachable only through winit 0.30's Wayland decorations (sctk-adwaita)
# and has no safe upgrade; tracked upstream at
# https://github.com/harfbuzz/ttf-parser/issues/217 (RUSTSEC-2026-0192).
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are local crates, not registry wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
