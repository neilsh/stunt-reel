[toolchain]
channel = "1.99.1"
# `mise run cov-rust` needs the LLVM tools, and rustup resolves the toolchain from this file
# (docs/development.md, "Dependency updates"); `mise.toml` names the same component as
# `llvm-tools`, so either installer must provide it or coverage depends on which one ran last.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
