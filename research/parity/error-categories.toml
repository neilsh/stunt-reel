# Render-error categories a vision model grades per frame (research/parity/metric-bench.md section 2.3).
#
# Add a category by appending a [[category]] block; the grading brief lists every block in order.
# A grading run made before a category existed has no grade for it, which a scorer reports as
# ungraded, not 0. Keep ids stable once graded: rename by adding a new id. `found_by` (the models
# whose discovery pass named it) and `since` are bookkeeping, not shown to graders.
#
# `examples` names sheets in error-examples/ (`<film>-<tick>.png`, drawn by `build_sheet`; those
# drawn before 2026-11-26 show a grey luma difference where newer sheets show the overlay and
# index map) that two different grading models each graded 2 or more for the category; two
# passes of one model do not count. Earlier examples are Haiku and Sonnet;
# intro-3466 was graded 2+ by Gemini Hydrogen and DSH under the 20-category file; the 19-category
# regrades were below 2 (work/2026-11/calibration-actor-floor/journal.md). An empty
# list means no sheet has met that rule yet, not that the readout never grades the error. Add one
# with `mise run parity-bench -- errors-example`, which copies the sheet there and names it here.
#
# The file also holds each film's tick window (`[films.<film>]`) and the smallest change in a
# category's count of frames graded 2+ that a readout comparison reports (`[readout] min_change`).

[[category]]
id = "aircraft-parts-missing"
definition = "Fuselage, cowl, propeller, wheels, cockpit or the wing stripe/checker pattern are not drawn; only bare wing shapes remain"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = ["ctry-0048", "ctry-0092"]

[[category]]
id = "aircraft-shape-broken"
definition = "The aircraft's silhouette is wrong: flattened into a sliver or wedge, a wing missing, struts floating free of the wings"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = ["ctry-0136", "ctry-0224"]

[[category]]
id = "aircraft-too-small"
definition = "The aircraft covers much less of the frame than in the capture"
found_by = ["haiku", "opus"]
since = "2026-10-31"
examples = []

[[category]]
id = "aircraft-misplaced"
definition = "The aircraft sits away from its capture position (higher, lower, left or right)"
found_by = ["haiku", "opus"]
since = "2026-10-31"
examples = []

[[category]]
id = "shadow-missing"
definition = "The black ground shadow under the aircraft is not drawn"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = ["ctry-0367", "ctry-0411"]

[[category]]
id = "sea-band-wrong"
definition = "The dark-blue sea strip near the horizon is drawn as a pale grey haze band instead"
found_by = ["sonnet", "opus"]
since = "2026-10-31"
examples = ["ctry-0004", "ctry-0048"]

[[category]]
id = "scenery-missing"
definition = "Roads, beach, trees, barn, silos, posts or distant buildings are absent, thinner or smaller"
found_by = ["sonnet", "opus"]
since = "2026-10-31"
examples = ["intro-2068", "ctry-0004"]

[[category]]
id = "ground-shade-wrong"
definition = "The whole field is a shade lighter or darker than the capture's"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = []

[[category]]
id = "ground-shade-edges"
definition = "The edges between ground shades are misplaced, extra, or drawn as sawtooth steps"
found_by = ["opus"]
since = "2026-10-31"
examples = ["intro-1416", "intro-2180"]

[[category]]
id = "background-misregistration"
definition = "Horizon, hills, road edges and sky bands are shifted a few pixels or differ slightly in shape"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = []

# Added from INTRO.FLM discovery (frames from tick 1000).
[[category]]
id = "aircraft-absent"
definition = "The CAPTURE shows an aircraft and the RENDER does not draw it at all, at most its shadow or a few stray specks; a frame with no aircraft in either panel is 0"
found_by = ["sonnet", "opus"]
since = "2026-10-31"
examples = ["intro-1009", "intro-1108"]

[[category]]
id = "shadow-shape-wrong"
definition = "The aircraft's ground shadow is drawn, but as a blob, sliver or fragments instead of the plane's silhouette, or away from where the capture's shadow is"
found_by = ["sonnet", "opus"]
since = "2026-10-31"
examples = ["intro-1108", "intro-1218"]

[[category]]
id = "actors-missing"
definition = "Ground vehicles, carts, people or parked and distant aircraft are not drawn (at most dark specks)"
found_by = ["haiku", "sonnet", "opus"]
since = "2026-10-31"
examples = ["intro-1317", "intro-2687"]

[[category]]
id = "terrain-type-wrong"
definition = "A ground region is drawn as the wrong surface (grass where the capture has sand), not just a different shade"
found_by = ["sonnet", "opus"]
since = "2026-10-31"
examples = ["intro-2687", "intro-2180"]

[[category]]
id = "explosion-missing"
definition = "An explosion, fireball or smoke effect in the capture is not drawn"
found_by = ["opus"]
since = "2026-10-31"
examples = ["intro-1416"]

# Added from the retail VAULT films' `other` notes (research/parity/batch-vault-films.md section 4), the
# three that recurred on more than one frame.
[[category]]
id = "sun-missing"
definition = "The sun disc in the capture's sky is not drawn, or the sky around it is a different colour"
found_by = ["haiku"]
since = "2026-11-01"
examples = []

[[category]]
id = "frame-blank"
definition = "The RENDER is one flat colour (often light grey) where the capture shows ground, sky and objects"
found_by = ["haiku"]
since = "2026-11-01"
examples = []

[[category]]
id = "black-block"
definition = "A solid black rectangle or blob is drawn over or in place of an object (a wall, sign, parachute) the capture shows"
found_by = ["haiku"]
since = "2026-11-01"
examples = []

# Added from the seven reference films' `other` notes at dd7e76eb (2026-11-25): the propeller error no
# category covered, named on several frames. Other recurring notes were edge shifts
# (misregistration), the capture's HUD timecode, or runway lights (scenery-missing).
[[category]]
id = "propeller-solid"
definition = "The RENDER draws the propeller as a solid blade or bar (often across the nose or fuselage) where the capture shows only faint spin flecks or no blade"
found_by = ["hydrogen"]
since = "2026-11-25"
examples = ["intro-3466"]

# A colour category, `aircraft-colour-wrong`, was added at 9be3e2cb with the propeller one and removed
# on 2026-11-25: a Claude Sonnet pass graded its candidate sheets 1, 0 and 0, so no sheet met the
# two-model example rule (work/2026-11/calibration-actor-floor/journal.md). Do not reuse the id for a
# different error.

# Which categories should rise when a fault is planted (keys as in stunt_reel.bench.faults Fault.key).
# A planted sheet counts as detected when the grade of any of these categories, or an `other` note,
# rises over the same frame's unplanted grade.
[faults]
"actors_removed" = ["aircraft-absent", "aircraft-parts-missing", "aircraft-shape-broken", "shadow-missing", "actors-missing"]
"shift_y:4" = ["background-misregistration", "aircraft-misplaced"]
"advance:5" = ["aircraft-misplaced", "background-misregistration", "aircraft-shape-broken"]

# Tick windows the readout picks frames from (end exclusive; omitted = to the end of the film).
# A film with no entry here is graded over its whole length.
[films.ctry]
start = 0
end = 990

[films.intro]
start = 1000

# compare reports a category only when its count of frames graded 2+ moves by at least this much.
# Set by the repeatability run (research/parity/metric-bench.md section 2.3): the largest change between
# two Haiku gradings of the same sheets was 3. Two DSH passes over the seven 20-category readouts
# moved a count by at most 1 (work/2026-11/calibration-actor-floor/readout-repeat.txt).
# Four is not shown to bound DSH: the 19-category BOMB passes differed by 12 frames (metric-bench.md).
[readout]
min_change = 4
