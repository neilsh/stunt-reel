# The capture parity scores each film against (ADR 0028, ADR 0029): the film's one frame capture,
# pinned by the hash of its content; promoting a new reference is an edit of this file in a
# reviewed commit.
#
# A row's `[<film>.expected.<class>]` table holds the scores one adapter reached on a measured
# `crates/` tree, filed under its renderer class: `gpu` (any adapter wgpu does not report as a
# CPU) or `lavapipe` (any CPU adapter, WARP included). `ssim` and `iou` are a report's
# `mean_ssim_scored` and `mean_iou_scored`; `crates` is the tree measured (`git rev-parse
# <commit>:crates`, rendered with `crates/` clean), which a squash merge keeps when no other
# `crates/` change lands first, so a clone without the branch commit can still compare; `sha256`
# and `all_sha256` are the row's pins it was measured against; `adapter` is the adapter's name,
# and drift is judged only against a render on an adapter of that name. `commit`, the commit
# measured, is optional and only says where: it is never compared. A PR that adopts a change
# updates the table of the class it measured, with `mise run parity-repin`; a conflict here is
# resolved by re-measuring the merged tree and repinning, never by hand-merging numbers.
#
# A row may set `background`, inclusive `[lo, hi]` capture palette-index bands that are backdrop or
# ground (sky, ground ramp, shade greens) rather than a model, which `parity_probe.py shift` and
# `iou` use to tell the capture's object pixels apart. A film without it is refused by those
# probes rather than read with another film's bands.
#
# A row may set `noise_sigma`, a film's recapture noise of the whole-frame SSIM, which `stuntreel
# parity --noise-sigma` takes and drift is judged against. None does: every reference is captured
# with its archive's sound range stubbed (ADR 0043), and two such captures of each film agreed
# page for page (research/parity/method.md section 2.2.1), so drift is any delta above the
# tables' precision and the verdict counts only a delta of exactly 0 as within noise (#305).

[ctry]
film = "vault-ctry"
sha256 = "dade17cae3d85a23fb829366c1c42813de51d91e9fdd93ffc8470cbc897b4c77"
# The archive the film plays (ADR 0037), as the capture's meta.json records it.
all_sha256 = "cb58d95b72f02819d15c5e6dad0973e72af8026455dbf5e13e41933711bb12ce"
# The builds the reference was made with (ADR 0029): `unpatched` or `patch3`. `reason` is
# required while either is unpatched.
makeone = "patch3"
playone = "patch3"
background = [[192, 199], [228, 238], [161, 165]]

[ctry.expected.gpu]
ssim = 0.9185174
iou = 0.9910147
crates = "3449b7b794dffcc0a5ba6724c6f0ecfa28ca0245"
sha256 = "dade17cae3d85a23fb829366c1c42813de51d91e9fdd93ffc8470cbc897b4c77"
all_sha256 = "cb58d95b72f02819d15c5e6dad0973e72af8026455dbf5e13e41933711bb12ce"
adapter = "NVIDIA GeForce RTX 4070 Laptop GPU"

