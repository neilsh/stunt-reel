# The capture parity scores each film against (ADR 0028, ADR 0029): the film's one frame capture,
# pinned by the hash of its content; promoting a new reference is an edit of this file in a
# reviewed commit.
#
# A row's `[<film>.expected.<class>]` table holds the scores one adapter reached at a measured
# commit, filed under its renderer class: `gpu` (any adapter wgpu does not report as a CPU) or
# `lavapipe` (any CPU adapter, WARP included). `ssim` and `iou` are a report's `mean_ssim_scored`
# and `mean_iou_scored`, `commit` the commit measured and `adapter` the adapter's name; drift is
# judged only against a render on an adapter of that name. A PR that adopts a change updates the
# table of the class it measured.

[ctry]
film = "vault-ctry"
sha256 = "9869444de53c653214144b83c2bdbce4a686a16f5189a1f5a94f6eb19605ed49"
# The archive the film plays (ADR 0037), as the capture's meta.json records it.
all_sha256 = "9de1bc1e8dbe491a56edd899b7c333cb78e5251cbe1e4ed75610dbc081aeb9a9"
# The builds the reference was made with (ADR 0029): `unpatched` or `patch3`. `reason` is
# required while either is unpatched.
makeone = "unpatched"
playone = "unpatched"
reason = "captured 2026-10-31 on the demo's unpatched PLAYONE with its shipped .ALL; recapture on patch3 is a later step (ADR 0029 Consequences)"
# Recapture noise of the whole-frame SSIM (004 against 005), from the metric bench
# (research/parity/method.md section 2.2); `stuntreel parity --noise-sigma` takes it. It is a
# lower bound for the noise of the verdict's delta on a few touched windows, so "within noise"
# is conservative.
noise_sigma = 0.000303

[ctry.expected.gpu]
ssim = 0.8986135
iou = 0.9896689
commit = "d01a3c4f6153b6f1c947432360a5e9546e0101d5"
adapter = "NVIDIA GeForce RTX 4070 Laptop GPU"

[intro]
film = "vault-intro"
sha256 = "ac93c3babb74c5380a0f1263d38a546b43979c8d4200fb0d2dfb58db482c0215"
all_sha256 = "27935a3638950d4ec75fc1f84f4ac15aa7308f0975b2a9d2e0c5f8a0c843035d"
makeone = "unpatched"
playone = "unpatched"
reason = "captured 2026-10-31 on the demo's unpatched PLAYONE with its shipped .ALL; recapture on patch3 is a later step (ADR 0029 Consequences)"

