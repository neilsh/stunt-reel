# The error-readout baseline: one readout.json per reference film, the grades only (no asset content).
# A render PR's readout passes its film's file as `errors-score --against` (error-readout.md).
# Refresh the seven together, per batch of render PRs, and edit this file with them.

# The 20-category sheets were made and scored at 6d511d14 (the `revision` in each run.json), the
# commit whose lavapipe render they grade, with the magenta/green overlay and index-mismatch panels
# (#1109) and the `object-misaligned` category (#1110). Both graders' input changed together with
# the render (since the 2026-11-26 baseline: list-order spheres #1159 and others) and the capture
# pairing (`pairing: render_tick`, #1172), so no category's move against the 2026-11-26 baseline can
# be attributed to the render or to the graders (the earlier split is work/2026-11/1118_readout-render-grader-split/).
