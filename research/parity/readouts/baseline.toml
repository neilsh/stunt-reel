# The error-readout baseline: one readout.json per reference film, the grades only (no asset content).
# A render PR's readout passes its film's file as `errors-score --against` (error-readout.md).
# Refresh the seven together, per batch of render PRs, and edit this file with them.

# The 19-category sheets were made and scored at 6486fb67 (the `revision` in each run.json), the
# commit whose lavapipe render they grade: it includes the render PRs #1096 and #1099 (#1102 changed only tests, a pin and docs).
# The run and grade files name no model; the grader names come from the coordinator's delegated-task
# records. The earlier baseline (e09f8ff6) was graded by DSH passes; this one by Haiku passes, so
# the comparison across the change of grader model is not calibrated, and a per-category difference
# between the two baselines cannot be told apart from a grader difference or from the render change.
# #1118 splits them by re-grading the e09f8ff6 sheets with two Haiku passes and a Sonnet tie-break;
# only CTRY's background-misregistration render part (+4) clears min_change (batch-vault-films.md § 7).
