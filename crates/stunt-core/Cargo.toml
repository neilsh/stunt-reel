[package]
name = "stunt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde"]
bytemuck = ["dep:bytemuck"]

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# Property tests: strategies compose and shrink through `prop_map` (quickcheck needs a
# newtype and hand-written shrinker per constrained input). No `fork`/`timeout` stack.
proptest = { version = "1.12", default-features = false, features = ["std"] }
