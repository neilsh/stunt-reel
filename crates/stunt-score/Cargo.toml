[package]
name = "stunt-score"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
stunt-core = { path = "../stunt-core", features = ["bytemuck", "serde"] }
stunt-parity = { path = "../stunt-parity" }
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
png = "0.18"
zstd = "0.14"
sha2 = "0.11"

[dev-dependencies]
image-compare = { version = "0.5.0", default-features = false }
