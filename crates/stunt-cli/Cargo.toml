[package]
name = "stunt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "stuntreel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
stunt-core = { path = "../stunt-core", features = ["serde"] }
stunt-gltf = { path = "../stunt-gltf" }
stunt-parity = { path = "../stunt-parity" }
stunt-render = { path = "../stunt-render" }
stunt-score = { path = "../stunt-score" }
winit = "0.30"
glam.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.1"
sha2.workspace = true
