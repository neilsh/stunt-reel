# The commit hooks, run by prek (ADR 0026). `mise run init` points core.hooksPath at .githooks,
# whose pre-commit runs `mise run pre-commit`, which is `prek run` over this file; nothing is
# installed by prek. prek checks the staged content: it sets unstaged edits aside first.
#
# Every local hook is exactly `mise run <task>` for a leaf task of mise.toml, so the hooks use
# the gate's own tools and versions and cannot drift from it; the rest are prek built-ins, which
# carry no version pin. To add a hook, add a leaf task first or pick a built-in, then update
# docs/adr/0026 and tests/test_prek_config.py, which refuses any other shape.
# The full gate is still `mise run check`.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "fmt-check-rust"
name = "Rust formatting (cargo fmt --check)"
entry = "mise run fmt-check-rust"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "fmt-check-py"
name = "Python formatting (ruff format --check)"
entry = "mise run fmt-check-py"
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "lint-py"
name = "Python lint (ruff check)"
entry = "mise run lint-py"
language = "system"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "test-docs"
name = "Documentation invariants (anchors, links, cited paths)"
entry = "mise run test-docs"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "check-work-frozen"
name = "Staged files added to a frozen work folder, or its outcome changed (work/README.md)"
entry = "mise run check-work-frozen"
language = "system"
always_run = true
pass_filenames = false

[[repos]]
repo = "builtin"

# CI runs the built-ins over a commit range with nothing staged, so these two must not depend on
# what is staged (--enforce-all) or on a merge being in progress (--assume-in-merge).
[[repos.hooks]]
id = "check-added-large-files"
args = ["--enforce-all"]
# A sweep's figures file holds every frame its recheck judges and may pass 500 KiB; check-toml
# still parses it, so no binary passes as one (ADR 0049).
exclude = '^work/[^/]+/[^/]+/sweeps/[^/]+\.toml$'

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

# A Windows checkout records no executable bit, so these read git's staged mode there. Rust's
# `#![...]` inner attributes read as shebangs, and dated work folders are frozen.
[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
exclude = '(\.rs$|^work/)'

[[repos.hooks]]
id = "check-executables-have-shebangs"

# These two run with --check, so they report and rewrite nothing. A Markdown hard break (two
# trailing spaces) is allowed, as .gitattributes allows it. Fixtures are byte-exact test inputs
# and dated work folders are frozen, so both are exempt here, not by a top-level `exclude`, which
# would also hide them from the large-file and private-key checks.
[[repos.hooks]]
id = "trailing-whitespace"
args = ["--check", "--markdown-linebreak-ext=md"]
exclude = "^(tests/fixtures|work)/"

[[repos.hooks]]
id = "end-of-file-fixer"
args = ["--check"]
exclude = "^(tests/fixtures|work)/"

# `.claude/skills` is a committed symlink, which a Windows checkout without core.symlinks turns
# into a text file; destroyed-symlinks reads `git status`, so it guards the commit, not CI.
# check-vcs-permalinks skips dated work folders, which are frozen records.
[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "fix-byte-order-marker"
args = ["--check"]
exclude = "^(tests/fixtures|work)/"

[[repos.hooks]]
id = "check-vcs-permalinks"
exclude = "^work/"

[[repos.hooks]]
id = "forbid-new-submodules"
