name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: check
          - os: windows-latest
            tasks: fmt-check lint typecheck test-py
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: rust python uv
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        run: mise run ${{ matrix.tasks }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: rust
      - uses: taiki-e/install-action@cargo-deny
      - run: mise run deny
