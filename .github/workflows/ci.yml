name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ubuntu job runs the GPU tests on lavapipe (Mesa's software Vulkan driver);
          # STUNT_REQUIRE_GPU=1 makes a missing adapter fail them instead of skipping.
          - os: ubuntu-latest
            tasks: check
            require_gpu: "1"
          - os: windows-latest
            tasks: check-windows
            require_gpu: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install lavapipe (software Vulkan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: jdx/mise-action@v5
        with:
          install_args: rust python uv
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo/registry
            .cache/cargo/git
            target
          # v2 (2026-10-25): the gate added target/check and target/matrix for its concurrent
          # lanes. A cache hit never saves, so the old key would leave those directories cold on
          # every run; the bump forces one fresh save that includes them.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        timeout-minutes: 30
        env:
          STUNT_REQUIRE_GPU: ${{ matrix.require_gpu }}
        run: mise run ${{ matrix.tasks }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The repository's allowed-actions policy admits GitHub-owned actions and the two
      # third-party patterns it names; rustup already ships on the runner, so install the
      # MSRV toolchain directly instead of adding another action to the allowlist.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: taiki-e/install-action@cargo-deny
        with:
          tool: cargo-deny@0.20.2
      - run: mise run deny
