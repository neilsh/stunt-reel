name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ubuntu job runs the GPU tests on lavapipe (Mesa's software Vulkan driver);
          # STUNT_REQUIRE_GPU=1 makes a missing adapter fail them instead of skipping.
          - os: ubuntu-latest
            tasks: check
            require_gpu: "1"
          - os: windows-latest
            tasks: fmt-check lint typecheck test-py
            require_gpu: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install lavapipe (software Vulkan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: jdx/mise-action@v3
        with:
          install_args: rust python uv
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        env:
          STUNT_REQUIRE_GPU: ${{ matrix.require_gpu }}
        run: mise run ${{ matrix.tasks }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install_args: rust
      - uses: taiki-e/install-action@cargo-deny
      - run: mise run deny
