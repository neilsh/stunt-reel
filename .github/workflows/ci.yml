name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Everything, including the full Windows gate: a manual run is the "prove this branch"
  # request, so it must not be a subset of what main gets.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Read tool releases from the GitHub API (mise-action passes the token) instead of
  # mise-versions.jdx.dev. A job whose mise.toml hash misses the tool cache installs from
  # scratch, and on 2026-10-31 that host answered 502 for the Kaitai compiler's release,
  # failing the gate before a test ran; a cache hit never asks it, so only such jobs failed.
  MISE_USE_VERSIONS_HOST: "false"

jobs:
  quality:
    name: Quality gate (ubuntu)
    # The full gate on every pull request and on main. The ubuntu job is the one that runs
    # the GPU tests, so it installs a software Vulkan driver; see ADR 0006.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # mise installs every tool mise.toml declares on the first `mise run` unless this is
      # off. Inside CI that compiled cargo-deny and cargo-llvm-cov from source on every job
      # and pulled Java, the Kaitai compiler and DOSBox into jobs whose task list never calls
      # them, which is minutes of the gate's cold start. Each job installs exactly the
      # toolchain it uses instead.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # java and the Kaitai compiler are not optional: the gate's `test-py` step sets
          # STUNT_REQUIRE_KSC=1, so a missing compiler fails the schema contract test rather
          # than skipping it.
          install_args: rust python uv java github:kaitai-io/kaitai_struct_compiler
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo/registry
            .cache/cargo/git
            target
          # v3 (2026-10-28): adds the `restore-keys` prefix below. A lockfile change misses
          # the exact key; with no prefix fallback that rebuilt the whole workspace from
          # scratch (a cold gate run measured 10m40 against 4m19 warm). The prefix restores
          # the newest previous cache and rebuilds only the delta. The bump forces one fresh
          # save, as the v2 note did for the gate's target/check and target/matrix lanes.
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        timeout-minutes: 25
        env:
          # STUNT_REQUIRE_GPU=1 makes a missing adapter fail the GPU tests instead of
          # skipping them.
          STUNT_REQUIRE_GPU: "1"
        run: mise run check

  windows-smoke:
    name: Windows smoke
    # The tests that can behave differently on Windows — junctions, reparse points, the
    # .cache link, the pytest basetemp workaround — all live in the Python tree: crates/ has
    # no cfg(windows). So pull requests pay for a Windows interpreter and a pytest run, not
    # a Rust build, and the full Windows gate below stays on main.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - run: mise run check-windows-smoke

  windows:
    name: Quality gate (windows)
    # Main and manual runs only: a warm Windows build still costs about nine minutes, and a
    # pull request needs it no more than it needs a second opinion on the Rust tree.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # Java and the Kaitai compiler keep this run's pytest selection identical to the
          # Ubuntu gate's, instead of letting the schema contract tests skip.
          install_args: rust python uv java github:kaitai-io/kaitai_struct_compiler
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo/registry
            .cache/cargo/git
            target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        timeout-minutes: 30
        # No driver is installed here and STUNT_REQUIRE_GPU stays unset, so the GPU tests
        # skip (ADR 0006).
        run: mise run check-windows

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository's allowed-actions policy admits GitHub-owned actions and the two
      # third-party patterns it names; rustup already ships on the runner, so install the
      # MSRV toolchain directly instead of adding another action to the allowlist.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The tool comes from taiki-e's prebuilt binary; with auto-install on, mise installed
      # its own copy as well and compiled it from source inside this job.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: mise run deny
