name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Everything, including the full Windows gate: a manual run is the "prove this branch"
  # request, so it must not be a subset of what main gets.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Read tool releases from the GitHub API (mise-action passes the token) instead of
  # mise-versions.jdx.dev. A job whose mise.toml hash misses the tool cache installs from
  # scratch, and on 2026-10-31 that host answered 502 for the Kaitai compiler's release,
  # failing the gate before a test ran; a cache hit never asks it, so only such jobs failed.
  MISE_USE_VERSIONS_HOST: "false"

jobs:
  scope:
    name: Scope
    # ADR 0047: whether a pull request's changed paths are all docs, by gate.py's own
    # classifier (ADR 0038), so the workflow holds no path table of its own. The jobs below
    # read the skip condition: this job succeeded and printed docs_only=true. Any other
    # outcome (a failure, a skip on a push or a manual run, or docs_only=false) runs them all.
    # The runner's system python3 cannot parse gate.py (PEP 810 lazy import), so mise
    # installs the pinned Python and nothing else.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The classifier diffs against origin/<base>, so it needs the base's history.
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python
      - name: Classify the changed paths
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        # Anything but the one expected line fails this job, and a failed scope runs every
        # job below.
        run: |
          out=$(mise exec -- python python/scripts/gate.py scope --base "origin/$BASE_REF")
          echo "$out"
          case "$out" in
            docs_only=true | docs_only=false) echo "$out" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::gate.py scope printed an unexpected line"; exit 1 ;;
          esac

  quality:
    name: Quality gate (ubuntu)
    # The full gate on main, on manual runs and on every pull request that is not docs-only;
    # a docs-only pull request runs the docs half instead (ADR 0047). The ubuntu job is the
    # one that runs the GPU tests, so it installs a software Vulkan driver; see ADR 0006.
    # It runs whatever scope did, unless the run was cancelled; its steps read DOCS_ONLY.
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # 'true' only under the skip condition (ADR 0047); 'false' when scope failed, was
      # skipped or said docs_only=false, so every such run is the full gate.
      DOCS_ONLY: ${{ needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true' }}
      # mise installs every tool mise.toml declares on the first `mise run` unless this is
      # off. Inside CI that compiled cargo-deny and cargo-llvm-cov from source on every job
      # and pulled Java, the Kaitai compiler and DOSBox into jobs whose task list never calls
      # them, which is minutes of the gate's cold start. Each job installs exactly the
      # toolchain it uses instead.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The empty-diff and commit-hook steps below diff against the base branch (the hooks,
          # on a push, against the previous tip), so they need its history and origin/<base>.
          fetch-depth: 0
      - name: The pull request changes files
        # Issue #216: a branch whose commits already merged as a squash still lists them ahead
        # of the base, so PR #214 was reviewed before anyone saw it was #192 again. The tree
        # diff from the merge base says so. It needs only git, so it runs before the toolchain
        # installs and an empty pull request fails in seconds. `git diff --quiet` exits 1 on a
        # change and 0 on none; any other status (no merge base, say) fails the step too.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          git diff --quiet "origin/$BASE_REF...HEAD" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::this pull request changes no files against $BASE_REF; its commits may already be merged (squash)"
            exit 1
          fi
          [ "$status" -eq 1 ] || exit "$status"
      - name: Install lavapipe (software Vulkan)
        if: env.DOCS_ONLY != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # java and the Kaitai compiler are not optional: the gate's `test-py` step sets
          # STUNT_REQUIRE_KSC=1, so a missing compiler fails the schema contract test rather
          # than skipping it. prek is likewise required (STUNT_REQUIRE_PREK=1), and runs the
          # commit-hook built-ins below. A docs-only run leaves out rust: check-docs starts and
          # passes without it (ADR 0047).
          install_args: ${{ env.DOCS_ONLY == 'true' && 'python uv java github:kaitai-io/kaitai_struct_compiler prek' || 'rust python uv java github:kaitai-io/kaitai_struct_compiler prek' }}
      - name: Cache Cargo
        if: env.DOCS_ONLY != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo/registry
            .cache/cargo/git
            target
          # v3 (2026-10-28): adds the `restore-keys` prefix below. A lockfile change misses
          # the exact key; with no prefix fallback that rebuilt the whole workspace from
          # scratch (a cold gate run measured 10m40 against 4m19 warm). The prefix restores
          # the newest previous cache and rebuilds only the delta. The bump forces one fresh
          # save, as the v2 note did for the gate's target/check and target/matrix lanes.
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        if: env.DOCS_ONLY != 'true'
        timeout-minutes: 25
        env:
          # STUNT_REQUIRE_GPU=1 makes a missing adapter fail the GPU tests instead of
          # skipping them.
          STUNT_REQUIRE_GPU: "1"
        run: mise run check
      - name: Run the docs half
        # A docs-only pull request (ADR 0047): the documentation tests, with the Kaitai
        # compiler required as in the full gate.
        if: env.DOCS_ONLY == 'true'
        timeout-minutes: 10
        run: mise run check-docs
      - name: Commit-hook built-ins on the changes
        # ADR 0026: a commit made with --no-verify, or pushed straight to main, still gets the
        # prek built-ins. The local hooks are skipped: the gate above ran the format, lint and
        # doc checks (frozen work folders among them, tests/test_work_frozen.py), and
        # check-work-frozen reads the index, which is empty here (prek.toml's args make the
        # large-file and conflict-marker built-ins read commits, and the whitespace built-ins
        # read files, not the index). A pull request checks its diff from the base branch, a
        # push its diff from the previous tip, and a manual run (or a push whose previous tip is
        # gone) every file.
        env:
          SKIP: fmt-check-rust,fmt-check-py,lint-py,test-docs,check-work-frozen
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --from-ref "origin/$BASE_REF" --to-ref HEAD
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            set -- --from-ref "$BEFORE" --to-ref HEAD
          else
            set -- --all-files
          fi
          mise exec -- prek run --config prek.toml "$@"

  windows-smoke:
    name: Windows smoke
    # The tests that can behave differently on Windows — junctions, reparse points, the
    # .cache link, the pytest basetemp workaround, the target seed's build locks and
    # robocopy — all live in the Python tree, marked `windows`: crates/ has
    # no cfg(windows). The module-layers test is marked too, so tach runs on Windows (ADR 0050).
    # So pull requests pay for a Windows interpreter and a pytest run, not
    # a Rust build, and the full Windows gate below stays on main. It skips under the skip
    # condition only (ADR 0047): a failed scope runs it. !cancelled() rather than an
    # unconditional run, so a run the concurrency group superseded stops here too.
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - run: mise run check-windows-smoke

  windows:
    name: Quality gate (windows)
    # Main and manual runs only: a warm Windows build still costs about nine minutes, and a
    # pull request needs it no more than it needs a second opinion on the Rust tree.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # Java and the Kaitai compiler keep this run's pytest selection identical to the
          # Ubuntu gate's, instead of letting the schema contract tests skip.
          install_args: rust python uv java github:kaitai-io/kaitai_struct_compiler
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo/registry
            .cache/cargo/git
            target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-
      - name: Install Python environment
        run: uv sync --locked --all-groups
      - name: Run quality tasks
        timeout-minutes: 30
        # No driver is installed here and STUNT_REQUIRE_GPU stays unset, so the GPU tests
        # skip (ADR 0006).
        run: mise run check-windows

  msrv:
    name: MSRV check
    # Skips under the skip condition only (ADR 0047): no docs path reaches the Rust tree.
    needs: scope
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository's allowed-actions policy admits GitHub-owned actions and the two
      # third-party patterns it names; rustup already ships on the runner, so install the
      # MSRV toolchain directly instead of adding another action to the allowlist.
      - name: Install Rust 1.100
        run: rustup toolchain install 1.100 --profile minimal
      - run: cargo +1.100 check --workspace --all-features --locked

  deny:
    name: Dependency policy
    # Skips under the skip condition only (ADR 0047): no docs path changes a Cargo manifest.
    needs: scope
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The tool comes from taiki-e's prebuilt binary; with auto-install on, mise installed
      # its own copy as well and compiled it from source inside this job.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
      - run: mise run deny
