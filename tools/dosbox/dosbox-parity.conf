# Parity capture profile: identical to dosbox-playone.conf, launched by `mise run capture-ref`.
# No control port here: the launch passes -set "dosbox mcp_server=<port>" for the port the
# controller bound, so a capture never competes with another one (ADR 0021).
[sdl]
windowresolution = 1280x960
windowposition = ,
# Surface output: the OpenGL renderer crashes (0xC0000409) when the debugger steps a
# Mode 13h guest; parity does not need GPU scaling.
output = surface
autolock = false
titlebar = DOSBox-X - Stunt Island: parity capture (VAULT\CTRY.FLM)

[cpu]
# Normal core: the dynamic recompiler aborts with "run out of cacheblocks" when the
# controller single-steps thousands of VRTs. Speed is irrelevant next to determinism.
core = normal
cycles = 8000

[dosbox]
memsize = 16

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
@echo off
mount c "corpus/stisldem"
c:
playone.exe
