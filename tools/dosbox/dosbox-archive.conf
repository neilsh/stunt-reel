# Archive profile for the batch survey (make_all.py --conf): dosbox-parity.conf with only the
# cpu core and cycles changed (tests/test_batch_stages.py checks the two agree otherwise).
# MAKEONE is not stepped by the debugger, so the dynamic core is safe: on flmonly-747land
# core=normal cycles=8000 took 179 s, core=dynamic cycles=max took 13 s (max 50% took 16 s), and the .ALL was
# byte-identical (core=normal cycles=max took 27 s). Captures keep dosbox-parity.conf
# (ADR 0023).
# No control port here: the launch tells DOSBox-X where to dial (ADR 0021).
[sdl]
windowresolution = 1280x960
windowposition = ,
# Surface output: the OpenGL renderer crashes (0xC0000409) when the debugger steps a
# Mode 13h guest; parity does not need GPU scaling.
output = surface
autolock = false
titlebar = DOSBox-X - Stunt Island: parity capture (VAULT\CTRY.FLM)

[cpu]
# Dynamic core at full speed: MAKEONE's output is the archive, not a frame.
core = dynamic
cycles = max

[dosbox]
memsize = 16

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
@echo off
mount c "corpus/stisldem"
c:
playone.exe
