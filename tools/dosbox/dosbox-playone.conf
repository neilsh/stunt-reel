[sdl]
windowresolution = 1280x960
windowposition = ,
output = opengl
autolock = false
titlebar = DOSBox-X - Stunt Island: VAULT\CTRY.FLM

[cpu]
core = dynamic
cycles = 30000

[dosbox]
memsize = 16

# No control port: `mise run play` never attaches the debugger. To watch a human play
# through it, launch by hand with -set "dosbox mcp_server=<dosbox_mcp_port>".

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
@echo off
mount c "corpus/stisldem"
c:
autotype -w 2 -p 0.5 enter c enter
playone.exe
