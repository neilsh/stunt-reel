[sdl]
windowresolution = 1024x768
output = surface
autolock = false
titlebar = DOSBox-X - Stunt Island utilities

[cpu]
core = dynamic
cycles = max

[dosbox]
memsize = 16

# No MCP server here on purpose: port 58991 is machine-wide and belongs to the
# capture harness, and these runs are short and scripted.

[autoexec]
@echo off
mount c "build/utils"
c:
