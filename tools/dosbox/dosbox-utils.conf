[sdl]
windowresolution = 1024x768
output = surface
autolock = false
titlebar = DOSBox-X - Stunt Island utilities

[cpu]
core = dynamic
cycles = max

[dosbox]
memsize = 16

# No control port here on purpose: these runs are short and scripted, and the port
# belongs to whichever debugger session is running (ADR 0021).

[autoexec]
@echo off
mount c "build/utils"
c:
