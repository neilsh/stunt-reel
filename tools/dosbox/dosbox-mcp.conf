[dosbox]
memsize = 16
shell permanent = true

# The port arrives on the command line: `mise run ensure-dosbox -- --mcp-port <port>`
# passes -set "dosbox mcp_server=<port>" for the port the MCP server chose (ADR 0021).

[sdl]
windowresolution = 1280x960
windowposition = ,
output = opengl
autolock = false

[cpu]
core = dynamic
cycles = 30000

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
mount c "corpus/stisldem"
c:
