# DOSBox-X conf for `mise run debug-x` (python/scripts/dbx/boot.py fills the braces).
# core = normal: the dynamic core aborts under the debugger; output = surface: OpenGL output
# crashed the retired harness (research/playone-exe/dosbox-x-legacy.md).
[dosbox]
memsize = 16
[sdl]
output = surface
autolock = false
[cpu]
core = normal
cycles = {cycles}
[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
[autoexec]
mount c "{mount}"
c:
PLAYONE.EXE
