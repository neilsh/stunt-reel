# #474: which light PLAYONE hands a rotated actor. 0x1CFB builds the actor's rotation from its
# three angles (BX BP SI at 0x1D20, into work:0x80D2), multiplies it with the view (0x80C0) into
# 0x808A, and transforms DS:0x49EC by 0x80D2 alone (0824:071D); at 0x1D49 DX BP DI hold the
# result, before doubling. ES is the work segment there (060A leaves it set).
[run]
stop_tick = 700

[[probe]]
name = "actor-angles"
kind = "break"
at = 0x1D20
arm = { tick = 150 }
hits = 12
capture = ["stack:4"]

[[probe]]
name = "actor-light"
kind = "break"
at = 0x1D49
arm = { tick = 150 }
hits = 12
capture = ["stack:4", "mem:ES:0x80D2:18", "mem:ES:0x80C0:18", "mem:ES:0x808A:18", "mem:DS:0x49EC:6"]

# The light SHADES (0x9481) dots each normal with: work:0x8072 (linear 0x25FF2 on the unpatched
# build, work segment 0x1DF8) and the normal at ES:SI, on the loop head 0x948C. The actor's entries should carry the light handed on above, doubled.
[[probe]]
name = "shades-normal"
kind = "break"
at = 0x948C
arm = { tick = 150 }
hits = 200
capture = ["lin:0x25FF2:6", "mem:ES:SI:6"]

# The actor's object segment, in ES at its call of the display-list entry 0x9100.
[[probe]]
name = "actor-object"
kind = "break"
at = 0x1D8D
arm = { tick = 150 }
hits = 12
capture = ["mem:ES:0:16"]
