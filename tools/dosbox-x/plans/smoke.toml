# Smoke check for `mise run debug-x`: the light setup 0x9100 fires and its caller and inputs read
# back as the 2026-11-04 spike found (return 0x2350; AX BX DX = DS:0x49EC..0x49F0).
[run]
stop_tick = 600

[[probe]]
name = "light-entry"
kind = "break"
at = 0x9100
hits = 2
capture = ["stack:4", "mem:DS:0x49EC:6"]
