# Smoke check for `mise run debug-x`: the light setup 0x9100 fires and its callers and inputs read
# back (returns 0x21FE and 0x2350, both in function 0x1DD5; AX BX DX = DS:0x49EC..0x49F0).
[run]
stop_tick = 600

[[probe]]
name = "light-entry"
kind = "break"
at = 0x9100
hits = 2
capture = ["stack:4", "mem:DS:0x49EC:6"]
