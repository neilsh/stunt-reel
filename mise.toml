[settings]
# Pin each tool's download URL and checksum per platform in mise.lock, so an install reads no
# GitHub API: cloud sessions share an IP whose anonymous API quota runs out (docs/harness-setup.md).
# After changing a pin, delete mise.lock and regenerate it with a token, since `mise lock` drops,
# with only a warning, any entry the API refuses:
#   GITHUB_TOKEN=$(gh auth token) mise lock --platform linux-x64,windows-x64
lockfile = true

[tools]
# Rust toolchain (provides rustc and cargo). Pinned: "latest" re-resolves whenever
# this file changes, which silently gave two worktrees different compilers.
# rustfmt and clippy are named explicitly because GitHub's runners configure rustup's
# `minimal` profile, which omits both; rustup's `default` profile would add them but
# also pull rust-docs, which the gate never uses. `minimal` is stated here too so a
# developer machine's default profile cannot reintroduce rust-docs on a fresh install.
rust = { version = "1.99.1", profile = "minimal", components = "llvm-tools,rustfmt,clippy" }

# Python & modern packaging toolchain
python = "3.15.2"
uv = "0.13.1"

# Supply-chain auditing for Cargo manifests (advisories, licenses, sources)
"cargo:cargo-deny" = "0.20.2"

# Line coverage for the Rust crates (`mise run cov-rust`); not part of `check`.
"cargo:cargo-llvm-cov" = "0.9.1"

# Runs the commit hooks (`mise run pre-commit`); they call mise tasks, never their own tools (ADR 0026).
prek = "0.5.5"

# JVM + Kaitai Struct Compiler for executing research/formats/**/*.ksy during verification.
# Java is required only to compile .ksy schemas; generated parsers run on the
# pure-Python kaitaistruct runtime.
java = "temurin-21"
"github:kaitai-io/kaitai_struct_compiler" = { version = "0.11", asset_pattern = "kaitai-struct-compiler-0.11.zip", strip_components = 1, bin_path = "bin", checksum = "sha256:ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2" }

# dosbox-automation (DOSBox Staging fork with a REST/Lua automation API): the emulator behind
# capture-ref, probe-light, make-all and play. Windows portable zip, pinned by checksum.
[tools."github:dosbox-automation/dosbox-automation"]
version = "0.85.1"
os = ["windows"]
asset_pattern = "dosbox-automation-*-windows-x64.zip"
checksum = "sha256:6835621f4731235651a886ef67c4fc40693454a6386f0e5ab5c0570965a186ee"

# DOSBox-X, for its built-in debugger link only: `mise run debug-x` runs breakpoint plans on it
# (ADR 0034); capture stays on dosbox-automation. The SDL1 build is the one the 2026-11-04 spike
# ran; the old pin chose SDL2 for OpenGL output, which this tool never uses.
[tools."github:joncampbell123/dosbox-x"]
version = "dosbox-x-v2026.10.01"
os = ["windows"]
asset_pattern = "dosbox-x-vsbuild-win64-*.zip"
bin_path = "bin/x64/Release"

[env]
# One shared, writable tool cache per primary checkout, named by absolute path from every
# checkout, so a worktree needs no .cache link (ADR 0013, ADR 0036). Each worktree keeps uv's
# own .venv; on the same volume uv hardlinks its packages out of this cache. Build outputs
# and the Python tool caches stay per worktree. CARGO_HOME is set per cargo task, to
# vars.cargo_home below, instead of here: mise installs its rustup shim into $CARGO_HOME,
# and a rustup inside this tree would run at the tree's low integrity and fail to reach the
# user's RUSTUP_HOME (ADR 0013). Tasks use the OS temp directory.
UV_CACHE_DIR = "{{vars.primary}}/.cache/uv"
# Python on Windows defaults text I/O to cp1252; scripts and docs here are UTF-8.
PYTHONUTF8 = "1"

[vars]
# One absolute path in every checkout: Cargo fingerprints a dependency by its CARGO_HOME path,
# so a target/ cloned from another checkout is fresh only if both name the cache alike (ADR 0030).
# git's common directory is the primary checkout's .git from any worktree, so `primary` is the
# primary checkout. Where git refuses (no .git, dubious ownership) the checkout itself stands in;
# config_root stays out of the shell command, which would run a `&` in the path.
primary = "{% set common = exec(command='git rev-parse --path-format=absolute --git-common-dir || echo -') %}{% if common == \"-\" %}{{ config_root }}{% else %}{{ common | dirname }}{% endif %}"
cargo_home = "{{vars.primary}}/.cache/cargo"
# The shared data root's default (ADR 0008, ADR 0036), for the Rust readers that take a path;
# Python reads STUNT_DATA_ROOT and its fallbacks through stunt_reel.dataroot instead.
data_root = "{{vars.primary}}.data"

[tasks.play]
description = "Play a film in PLAYONE.EXE on dosbox-automation (mise run play -- --film corpus/stisldem/VAULT/INTRO.FLM)"
run = "uv run python python/scripts/play.py"

[tasks.init]
description = "Seed target/, set core.hooksPath and sync .venv now, rather than at the first task; links nothing (mise run init -- --migrate moves an in-checkout corpus into the data root)"
# Plain python, not "uv run": init runs uv sync itself, and works before any environment
# exists. PYTHONPATH names the package source, which is all it imports.
# STUNT_CARGO_HOME is the cache path the seed judges donors by: the one cargo tasks use.
run = "python python/scripts/worktree_init.py init"
env = { PYTHONPATH = "{{config_root}}/python", STUNT_CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.ensure]
description = "Seed an empty target/ and set core.hooksPath, under a lock; every task that builds Rust runs it first (ADR 0036)"
hide = true
quiet = true
run = "python python/scripts/worktree_init.py ensure"
env = { PYTHONPATH = "{{config_root}}/python", STUNT_CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.seed]
description = "Clone a built target/ from another checkout into this one's empty target/ (ADR 0030)"
run = "python python/scripts/worktree_init.py seed"
env = { PYTHONPATH = "{{config_root}}/python", STUNT_CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.clean]
description = "Report this worktree's build outputs; remove them with --yes (mise run clean -- --yes), or rotate parity render trees only (mise run clean -- --parity --keep 3 --yes)"
run = "uv run python python/scripts/worktree_init.py clean"

[tasks.reap]
description = "Remove worktrees whose branch is already in main or was squash-merged (a merged PR whose head is the branch tip, read with gh), unlinking their data-root junctions first; removes nothing while 20 GB or more is free unless --force, or while its worktree_init.py differs from origin/main's unless --allow-stale-script (mise run reap -- --yes [--force] [--min-free-gb N] [--allow-stale-script] [--cherry] [--prune] [--stash-dirty] [--discard-untracked])"
run = "uv run python python/scripts/worktree_init.py reap"

[tasks.pr-threads]
description = "A pull request's unresolved review threads, one line each with the comment id to reply to, then its outside-diff findings; or reply in and resolve a thread (mise run pr-threads -- <number> [--all] | [--reply <id> --body <text>|--body-file <path>] [--resolve <id>])"
run = "uv run python python/scripts/pr_threads.py"

[tasks.work]
description = "Start a work item's folder, work/<YYYY-MM>/<issue>_<slug>/, filing its GitHub issue first unless --issue names one; or list every work folder with its issue's status (mise run work -- new <slug> [--issue N] | list [--status active|landed|abandoned])"
run = "uv run python python/scripts/work.py"

[tasks.knowledge-map]
description = "Rewrite research/MAP.md, every research note listed by folder with its summary: frontmatter, or exit 1 naming it when it is stale (mise run knowledge-map -- --write | --check [--root DIR]); mise run fix runs --write"
run = "uv run python python/scripts/knowledge_map.py"

[tasks.build-at]
depends = ["ensure"]
description = "Build stunt-cli from a git revision with an isolated target dir (mise run build-at -- <rev> <out>)"
run = "uv run python python/scripts/build_at.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.capture-ref]
# This and capture-video and make-all build the release binary that `stuntreel link` needs to
# rebuild a film's .ALL.
depends = ["ensure"]
description = "Capture PLAYONE.EXE Mode 13h frames for visual parity into captures/<film>/frames/ (default CTRY; mise run capture-ref -- --film corpus/stisldem/VAULT/INTRO.FLM)"
run = "uv run python python/scripts/capture_playone_reference.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.capture-video]
description = "Record a film as one AVI with its tick and palette log into captures/<film>/video/ (mise run capture-video -- --film corpus/stisldem/VAULT/CTRY.FLM)"
depends = ["ensure"]
run = "uv run python python/scripts/capture_video.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.capture-digest]
description = "Print a capture's content hash and the references.toml entry that would promote it (mise run capture-digest -- vault-ctry)"
run = "uv run python python/scripts/capture_digest.py"

[tasks.make-all]
description = "Generate a film's .ALL with MAKEONE.EXE on dosbox-automation into captures/<film>/archives/ (mise run make-all -- --film corpus/stuntisl/VAULT/BALLOON.FLM)"
depends = ["ensure"]
run = "uv run python python/scripts/make_all.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.game-builds]
description = "Build the unpatched and the Patch #3 game trees under <data root>/builds/ with a manifest of what the patch changes (mise run game-builds)"
run = "uv run python python/scripts/game_builds.py"

[tasks.migrate-captures]
description = "One-time move to one capture of each kind per film (ADR 0028): keep the pinned references, delete the other runs; a dry run unless given --yes"
run = "uv run python python/scripts/migrate_captures.py"

[tasks.sweep]
depends = ["ensure"]
description = "Candidate sweep: render and score DBG_* variants on every reference film (mise run sweep -- --var DBG_X=0,1 [--films ctry] [--probe iou] [--keep-best] [--jobs N] [--no-build] [--reuse DIR] [--retime N])"
run = "uv run python python/scripts/parity_sweep.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.parity]
depends = ["ensure"]
description = "Parity baseline: render every reference film with the current binary and print the headline scores (mise run parity -- [--films ctry,intro] [--jobs N] [--no-build] [--no-render] [--reuse DIR] [--retime N])"
run = "uv run python python/scripts/parity_run.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.parity-bench]
description = "Parity metric bench: plant faults, score metrics against recapture noise (mise run parity-bench -- run --film ctry [--render DIR] [--recapture ID] | plant --render DIR --out DIR --fault shift_x:4@500-599 | errors-make --film ctry [--calibrate] [--batch] | errors-disputes --film ctry | errors-score --film ctry [--against FILE] [--batch] | errors-example --film ctry --tick T --category ID | errors-table --films vault-ctry,vault-land)"
run = "uv run python python/scripts/parity_bench.py"

[tasks.parity-probe]
depends = ["ensure"]
description = "Diagnostic probes on one capture/render pair (mise run parity-probe -- crop|shift|iou|retime ... ; summary prints the rows the parity log needs)"
run = "uv run python python/scripts/parity_probe.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.frame]
depends = ["ensure"]
description = "Render film ticks in one process and write each beside its reference capture frame (mise run frame -- --film intro --ticks 48,92,1009 [--crop x0,y0,x1,y1] [--scale N] [--no-build] [--var DBG_X=0,1]; --var draws one panel per value after the capture)"
run = "uv run python python/scripts/parity_frame.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.shape-diff]
depends = ["ensure"]
description = "Run stuntreel shape-views once per DBG_* value and draw only the shapes whose geometry hash changed (mise run shape-diff -- --var DBG_X=0,1 [--shapes IDS|FILE] [--archive X.ALL] [--views top,side,front] [--tile PX] [--no-build]; the archive defaults to SUPERSET.ALL)"
run = "uv run python python/scripts/shape_diff.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.batch-parity]
depends = ["ensure"]
description = "Batch parity survey: every distinct corpus film through archive, capture, render and score, resumable from a ledger (mise run batch-parity -- [--only SLUG,...] [--limit N] [--stages archive,capture,render,score] [--retry-errors] [--summary] [--skip SLUG,...] [--jobs N] [--max-renders N] [--min-free-gb GB] [--archive-timeout S] [--capture-timeout S] [--data-root DIR])"
run = "uv run python python/scripts/batch_parity.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.verify-docs]
description = "Verify the formats catalog: structure, evidentiary tiers, links, asset isolation"
run = "uv run python python/scripts/verify_formats_docs.py"

[tasks.skill-eval]
description = "Dry-run a prompt through headless claude -p and report which skills each run loaded (mise run skill-eval -- --skill NAME --model opus|haiku --phase baseline|with --prompt-file PATH [--reps 3])"
run = "uv run python python/scripts/skill_eval.py"

[tasks.unlzexe]
description = "Unpack PLAYONE.EXE with LZEXE 0.91, by default the data root's corpus/stuntisl/PLAYONE.EXE to its build/re/playone.img (mise run unlzexe -- [<exe> <out>] [--mz])"
run = "uv run python python/scripts/unlzexe.py"

[tasks.debug-x]
description = "Run a breakpoint plan on DOSBox-X's debugger (mise run debug-x -- --plan tools/dosbox-x/plans/smoke.toml [--film F] [--build patch3])"
run = "uv run python python/scripts/debug_x.py"

[tasks.gvpoly-stream]
description = "List the GVPOLY polygons in a debug-x JSONL by object and ramp base (mise run gvpoly-stream -- <jsonl> [--handlers 0x995C,0x9A24] [--json out.json])"
run = "uv run python python/scripts/gvpoly_stream.py"

[tasks.pair-builds]
description = "Pair two builds' functions with an iced-x86 decode and map offsets (mise run pair-builds -- [--ds 0x0542,0x8072@0x824] [--code 0x196C] [--unpaired])"
run = "uv run python python/scripts/pair_builds.py"

[tasks.xref]
description = "Find the code whose 16-bit operand is a value in PLAYONE.EXE, or that references a string or data offset in any MZ, LZEXE or image file (mise run xref -- <imm16> [--code-end 0xD510] [--image F] | <exe> --string map.bin | <exe> --offset 0x22C2 --ds 0x163D [--context N])"
run = "uv run python python/scripts/re_tool.py xref"

[tasks.disasm]
description = "Disassemble PLAYONE.EXE between two load-image offsets (mise run disasm -- <start> <end> [--image F])"
run = "uv run python python/scripts/re_tool.py disasm"

[tasks.vm-handler]
description = "Follow a display-list opcode's dispatch slot to its PLAYONE.EXE handler and any subtype table (mise run vm-handler -- 0x0063 [--image F] [--vm-seg 0x824] [--work-seg 0x15D4])"
run = "uv run python python/scripts/re_tool.py vm-handler"

[tasks.probe-light]
description = "Probe PLAYONE per-shot light and shade arrays through dosbox-automation (mise run probe-light -- --ticks 10,150,273,448)"
run = "uv run python python/scripts/probe_playone_light.py"

[tasks.scene-ground]
description = "Walk PLAYONE's embedded scene tree and compare its Ground polygons with MAP.BIN (mise run scene-ground -- build/re/playone.img corpus/siarchive/Developer/FreeFlight/SIDATA/MAP.BIN)"
run = "uv run python python/scripts/scene_ground.py"

[tasks.scene-patches]
description = "For each MAP.BIN patch with no polygon in PLAYONE's scene tree, check SCENERY.scn, byte scans, OP_TAP operands and the polygons under it (mise run scene-patches -- build/re/playone.img <MAP.BIN> --scn <SCENERY.scn> --scan <dir>)"
run = "uv run python python/scripts/scene_patches.py"

[tasks.flm-events]
description = "Dump the film-level events of one .FLM film (mise run flm-events -- corpus/.../CTRY.FLM [--sounds])"
run = "uv run python python/scripts/flm_events.py"

[tasks.superset-all]
description = "Build one .ALL holding every stock shape in the game's RES/, for rendering a film without its own archive (mise run superset-all -- [--game corpus/stuntisl] [-o target/linked/superset/SUPERSET.ALL])"
depends = ["ensure"]
run = "uv run python python/scripts/superset_all.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.cloud-assets]
description = "Pack, upload or fetch the game archives cloud sessions use (mise run cloud-assets -- [--data-root DIR] pack|upload|fetch|status [ARCHIVE...]; ADR 0039)"
run = "uv run python python/scripts/cloud_assets.py"

[tasks.cloud-session-start]
description = "The SessionStart hook: in a cloud session only, rerun the cloud setup, fetch the game archives and build SUPERSET.ALL (ADR 0039)"
hide = true
# The hook runs on every session start; outside a cloud session it does nothing, so a local
# machine never reaches the cloud setup's apt or mise install. It reruns .claude/cloud-setup.sh
# because the setup script's cache outlives a pin change; work already done costs nothing. It
# fetches here, not in the setup script, because the environment's R2_* and STUNT_DATA_ROOT are
# set only once Claude Code starts. It always exits 0 and prints one line: a hook's stdout
# reaches Claude only on success, and Claude must know when the archives are missing.
env = { MISE_LOCKED = "1" }
run = '''
[ "${CLAUDE_CODE_REMOTE:-}" = true ] || exit 0
log=/tmp/cloud-session-start.log
if { bash .claude/cloud-setup.sh --cloud &&
     mise run cloud-assets -- fetch && mise run superset-all; } >"$log" 2>&1; then
  echo "cloud-session-start: tools, game archives and SUPERSET.ALL ready (log: $log)"
else
  echo "cloud-session-start FAILED: tools, game archives or SUPERSET.ALL may be missing; see $log and mise run cloud-assets -- status"
fi
'''
run_windows = "exit 0"

[tasks.adversarial]
description = "Adversarial stress suite over the formats catalog's constraints and claims"
run = "uv run python python/scripts/adversarial_formats_challenge.py"

# Development & Quality Assurance Tasks
[tasks.lint-rust]
depends = ["ensure"]
description = "Run Rust Clippy lints across all crates"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
# Check-profile artifacts live in their own target directory so the clippy lane and the
# build-profile test lane can compile at the same time instead of queueing on one lock.
# No incremental state here, in doc or in the matrix lane: it held 278 MB after a dozen edits and
# saves under a second per re-check (ADR 0030). The test lane in target/ keeps it.
env = { CARGO_HOME = "{{vars.cargo_home}}", CARGO_TARGET_DIR = "{{config_root}}/target/check", CARGO_INCREMENTAL = "0" }

[tasks.lint-py]
description = "Run Ruff linter on Python codebase"
run = "uv run ruff check ."

[tasks.lint]
description = "Run all Rust and Python linters"
depends = ["lint-rust", "lint-py"]

[tasks.fmt-rust]
description = "Format Rust source files"
run = "cargo fmt"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.fmt-py]
description = "Format Python source files"
run = "uv run ruff format"

[tasks.fmt]
description = "Format all Rust and Python code"
depends = ["fmt-rust", "fmt-py"]

[tasks.fmt-check-rust]
description = "Check Rust formatting"
run = "cargo fmt --check"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.fmt-check-py]
description = "Check Python formatting"
run = "uv run ruff format --check ."

[tasks.fmt-check]
description = "Verify all code formatting"
depends = ["fmt-check-rust", "fmt-check-py"]

# Applies every automatic fix the gate's lint and format steps can: the gate's `fmt-check-rust`,
# `fmt-check-py` and `lint-py` failures (gate.py FIXABLE_STEPS) name this task. It reuses fmt-rust
# and fmt-py and runs ruff over the same `.` as lint-py, so it fixes exactly what the gate checks.
# Ruff's lint fixes run before `ruff format` because they can change layout. `--exit-zero` keeps
# an unfixable finding from stopping the format; the next `check-py` still reports it. Last, it
# regenerates research/MAP.md, which the docs test test_research_map_is_current checks.
[tasks.fix]
description = "Apply every automatic fix the gate's lint and format steps can (ruff check --fix, ruff format, cargo fmt) and regenerate research/MAP.md"
run = [
  { task = "fmt-rust" },
  "uv run ruff check --fix --exit-zero .",
  { task = "fmt-py" },
  "uv run python python/scripts/knowledge_map.py --write",
]

[tasks.typecheck]
description = "Run Python static type checking (mypy), once as Windows and once as Linux"
# mypy prunes `sys.platform` branches for the platform it analyses, so a check on one OS
# passes code the other reports as unreachable; CI typechecks on Linux, most work happens on
# Windows. Each platform keeps its own cache so neither run invalidates the other.
run = [
  "uv run mypy --platform win32 --cache-dir .mypy_cache/win32",
  "uv run mypy --platform linux --cache-dir .mypy_cache/linux",
]

[tasks.test-rust]
depends = ["ensure"]
description = "Run Rust unit and integration tests"
run = "cargo test --locked --workspace --all-features"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.test-render]
depends = ["ensure"]
description = "Run stunt-render's GPU test binary (`gpu`) with a bounded hang watchdog (detects hangs instead of waiting forever)"
run = "uv run python python/scripts/watch_render_test.py"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.cov-rust]
depends = ["ensure"]
description = "Line coverage for the Rust format crates (stunt-core, stunt-gltf)"
run = "cargo llvm-cov --locked -p stunt-core -p stunt-gltf --all-features --summary-only"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.test-py]
description = "Run Python pytest suite; `mise run test-py -- <path> [-k <expr>]` runs part of it"
run = "uv run pytest"

[tasks.test]
description = "Run all test suites (Rust & Python)"
depends = ["test-rust", "test-py"]

[tasks.deny]
description = "Check dependency advisories, licenses, and sources"
run = "cargo deny check"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.doc]
depends = ["ensure"]
description = "Build rustdoc with warnings denied"
run = "cargo doc --workspace --no-deps --all-features"
# rustdoc reads its dependencies' metadata, the same units clippy builds in target/check; in
# target/ it would build a second copy of them (192 MB) beside the test lane's. It turns off
# incremental state like clippy, whose units it reuses.
env = { RUSTDOCFLAGS = "-D warnings", CARGO_HOME = "{{vars.cargo_home}}", CARGO_TARGET_DIR = "{{config_root}}/target/check", CARGO_INCREMENTAL = "0" }

[tasks.check-rust-matrix]
depends = ["ensure"]
description = "Test stunt-core without optional features, in a target directory of its own"
# cargo test also builds the plain library for the integration tests, so the old
# `cargo check` prefix compiled the same no-default-features library a second time for no extra
# coverage. The private directory keeps this build from invalidating the all-features
# artifacts in target/ and lets it run beside the other lanes.
run = "cargo test -p stunt-core --no-default-features"
env = { CARGO_HOME = "{{vars.cargo_home}}", CARGO_TARGET_DIR = "{{config_root}}/target/matrix", CARGO_INCREMENTAL = "0" }

[tasks.cov-py]
description = "Run Python test suite with coverage reporting"
run = "uv run pytest --cov=stunt_reel --cov-report=term-missing"

# The three gate tasks dispatch one script (ADR 0014; lanes: ADR 0016). The step list is the
# leaf tasks in python/scripts/gate.py, so the halves cannot run a shorter gate than the whole,
# and every step there needs a lane in STEP_LANES or the gate refuses to start.
[tasks.check-rust]
description = "Rust half of the gate (fmt, clippy, test, doc, no-default-features matrix), one line per step"
run = "python python/scripts/gate.py rust"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.check-py]
description = "Python half of the gate (fmt, lint, mypy, pytest), one line per step"
run = "python python/scripts/gate.py py"

[tasks.check-docs]
description = "Documentation half of the gate (the documentation tests, test-py-docs), one line per step"
run = "python python/scripts/gate.py docs"

[tasks.check]
description = "Quality gate for what the branch changes (`mise run check -- --full` runs everything): one line per step, PASS/FAIL verdict, full log in target/check.log"
run = "python python/scripts/gate.py all"

[tasks.test-docs]
description = "Documentation invariants only: anchors, Markdown links, cited paths (part of test-py; the pre-commit hook runs it on every commit)"
run = "uv run pytest tests/test_doc_invariants.py -q"

[tasks.test-py-docs]
description = "Documentation tests only (`pytest -m docs`: anchors and links, the formats catalog, the schema contract); the gate's docs step"
run = "uv run pytest -m docs"

[tasks.diff-check]
description = "Staged conflict markers and whitespace errors (git diff --cached --check); a pre-commit hook"
run = "git diff --cached --check"

[tasks.crlf-check]
description = "Staged text files whose working copy has CRLF line endings (python/scripts/check_crlf.py); a pre-commit hook"
run = "uv run python python/scripts/check_crlf.py"

[tasks.commit-msg-check]
description = "A commit message's Conventional Commit subject and gate line (python/scripts/check_commit_msg.py, AGENTS.md, Committing); the commit-msg hook"
run = "uv run python python/scripts/check_commit_msg.py"

# The committed hook (.githooks/pre-commit, installed by mise run init) runs this and nothing
# else. prek.toml's local hooks are leaf tasks of this file like the gate's (ADR 0014): no second copy.
[tasks.pre-commit]
description = "What the pre-commit hook runs: prek over prek.toml (ADR 0026)"
run = "prek run --quiet --config prek.toml"

[tasks.check-windows]
description = "Windows non-GPU half of the gate (fmt, lint, typecheck, Rust and Python tests; GPU tests skip without a driver)"
depends = ["fmt-check", "lint", "typecheck", "test"]

# The Windows-only behaviour is all in the Python tree — junctions, reparse points, the
# .cache link, the pytest basetemp workaround, Cargo's build locks and robocopy in the target
# seed — so the pull-request job runs this instead of the whole check-windows; the full task
# stays on main. A module carries the `windows` marker to run here, and
# tests/test_windows_marker.py fails one that checks the platform without it.
[tasks.check-windows-smoke]
description = "Windows-only smoke: the tests marked `windows` (junctions, reparse points, .cache links, build locks)"
run = "uv run pytest -m windows"

[tasks.verify-corpus]
description = "Compile research/formats/**/*.ksy and check them against local corpus/ files (opt-in; corpus is gitignored)"
run = "uv run python python/scripts/verify_schemas_corpus.py"

[tasks.sod-census]
# The corpus is the one dataroot.corpus_root() finds, handed over in STUNT_CORPUS by
# run_with_corpus.py rather than worked out again here; `-- --corpus DIR` names another.
depends = ["ensure"]
description = "Census of corpus .SOD models that stop on unimplemented opcodes, joined to the films placing them (opt-in; corpus is gitignored; mise run sod-census -- [--format markdown])"
run = "uv run python python/scripts/run_with_corpus.py cargo run --release --locked -p stunt-cli --bin stuntreel -- sod-census"
env = { CARGO_HOME = "{{vars.cargo_home}}" }

[tasks.test-corpus]
depends = ["ensure"]
description = "Run the Rust tests that read the game files, which test-rust skips (opt-in; corpus is gitignored)"
run = "uv run python python/scripts/run_with_corpus.py cargo test --locked -p stunt-core -- --ignored"
env = { CARGO_HOME = "{{vars.cargo_home}}" }
