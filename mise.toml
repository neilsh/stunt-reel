[tools]
# Rust toolchain (provides rustc and cargo). Pinned: "latest" re-resolves whenever
# this file changes, which silently gave two worktrees different compilers.
# rustfmt and clippy are named explicitly because GitHub's runners configure rustup's
# `minimal` profile, which omits both; rustup's `default` profile would add them but
# also pull rust-docs, which the gate never uses. `minimal` is stated here too so a
# developer machine's default profile cannot reintroduce rust-docs on a fresh install.
rust = { version = "1.99.1", profile = "minimal", components = "llvm-tools,rustfmt,clippy" }

# Python & modern packaging toolchain
python = "3.11"
uv = "0.13.1"

# Supply-chain auditing for Cargo manifests (advisories, licenses, sources)
"cargo:cargo-deny" = "0.20.2"

# Line coverage for the Rust crates (`mise run cov-rust`); not part of `check`.
"cargo:cargo-llvm-cov" = "0.9.1"

# JVM + Kaitai Struct Compiler for executing research/formats/**/*.ksy during verification.
# Java is required only to compile .ksy schemas; generated parsers run on the
# pure-Python kaitaistruct runtime.
java = "temurin-21"
"github:kaitai-io/kaitai_struct_compiler" = { version = "0.11", asset_pattern = "kaitai-struct-compiler-0.11.zip", strip_components = 1, bin_path = "bin", checksum = "sha256:ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2" }

# DOSBox-X MCP Server: prebuilt release binary downloaded via mise's GitHub backend.
# Automatically resolves architecture across Windows, macOS, and Linux.
"github:caiiiycuk/dosbox-x-mcp-server" = "0.1.2"

# Windows 64-bit DOSBox-X tool definition.
# Only activated on Windows; on macOS/Linux, dosbox-x is installed via system package manager or Homebrew.
[tools."github:joncampbell123/dosbox-x"]
version = "dosbox-x-v2026.10.01"
os = ["windows"]
# Pin explicitly to portable 64-bit zip to avoid 32-bit archives or setup installers (.exe)
asset_pattern = "dosbox-x-vsbuild-win64-*.zip"
# Why SDL2: SDL2 build is required on Windows for stability with OpenGL output
bin_path = "bin/x64/Release SDL2"

[env]
# One shared, writable tool cache per primary checkout: mise run init links each
# worktree's .cache to it (ADR 0013). Build outputs, the virtualenv and the
# Python tool caches stay per worktree. CARGO_HOME is set per cargo task
# instead of here: mise installs its rustup shim into $CARGO_HOME, and a rustup
# inside this tree would run at the tree's low integrity and fail to reach the
# user's RUSTUP_HOME (ADR 0013).
UV_CACHE_DIR = "{{config_root}}/.cache/uv"
# Python on Windows defaults text I/O to cp1252; scripts and docs here are UTF-8.
PYTHONUTF8 = "1"
# The sandbox denies the OS temp directory to the processes a task spawns, so every task
# points at one path inside the shared cache; mise run init creates it (ADR 0013,
# docs/harness.md). Set here rather than per test task so a new test-bearing task cannot
# forget it, and so mise exec applies it too.
TMP = "{{config_root}}/.cache/tmp"
TEMP = "{{config_root}}/.cache/tmp"

[tasks.play]
description = "Launch Stunt Island film reel playback"
run = "dosbox-x -conf dosbox-playone.conf"

[tasks.ensure-dosbox]
description = "Ensure DOSBox-X is running in the background with MCP enabled"
# Unix (macOS / Linux): uses pgrep and backgrounding (&)
run = """
if ! pgrep -x "dosbox-x" > /dev/null 2>&1; then
    dosbox-x -conf dosbox-mcp.conf &
    sleep 1
fi
"""
# Windows: checks Get-Process to prevent duplicate instances and starts detached
run_windows = "powershell -NoProfile -Command \"if (-not (Get-Process dosbox-x -ErrorAction SilentlyContinue)) { Start-Process (mise which dosbox-x) -ArgumentList @('-conf', 'dosbox-mcp.conf') -WorkingDirectory (Get-Location) }\""

[tasks.mcp]
description = "Launch DOSBox-X MCP server (ensuring DOSBox-X is running)"
depends = ["ensure-dosbox"]
run = "dosbox-x-mcp-server"

[tasks.init]
description = "Link the shared data root into this worktree and create the Python environment (mise run init -- --migrate adopts an existing corpus)"
run = "uv sync --locked --all-groups && uv run python python/scripts/worktree_init.py init"

[tasks.clean]
description = "Report this worktree's build outputs; remove them with --yes (mise run clean -- --yes), or rotate parity render trees only (mise run clean -- --parity --keep 3 --yes)"
run = "uv run python python/scripts/worktree_init.py clean"

[tasks.reap]
description = "Remove worktrees whose branch is already in main, unlinking their data-root junctions first (mise run reap -- --yes [--cherry] [--prune] [--stash-dirty] [--discard-untracked])"
run = "uv run python python/scripts/worktree_init.py reap"

[tasks.build-at]
description = "Build stunt-cli from a git revision with an isolated target dir (mise run build-at -- <rev> <out>)"
run = "uv run python python/scripts/build_at.py"

[tasks.capture-ref]
description = "Capture PLAYONE.EXE Mode 13h frames for visual parity (default CTRY; mise run capture-ref -- --film corpus/stisldem/VAULT/INTRO.FLM)"
run = "uv run python python/scripts/capture_playone_reference.py"

[tasks.sweep]
description = "Candidate sweep: render and score DBG_* variants on CTRY and INTRO (mise run sweep -- --var DBG_X=0,1 [--films ctry] [--probe iou] [--keep-best] [--no-build] [--reuse DIR] [--retime N])"
run = "uv run python python/scripts/parity_sweep.py"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.parity]
description = "Parity baseline: render both films with the current binary and print the headline scores (mise run parity -- [--films ctry,intro] [--no-build] [--no-render] [--reuse DIR] [--retime N])"
run = "uv run python python/scripts/parity_run.py"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.parity-probe]
description = "Diagnostic probes on one capture/render pair (mise run parity-probe -- crop|shift|iou|retime ... ; summary prints the rows the parity log needs)"
run = "uv run python python/scripts/parity_probe.py"

[tasks.verify-docs]
description = "Verify the formats catalog: structure, evidentiary tiers, links, cleanroom isolation"
run = "uv run python python/scripts/verify_formats_docs.py"

[tasks.unlzexe]
description = "Unpack PLAYONE.EXE with LZEXE 0.91 (mise run unlzexe -- target_bin/PLAYONE.EXE build/re/playone.img [--mz])"
run = "uv run python python/scripts/unlzexe.py"

[tasks.probe-light]
description = "Probe PLAYONE per-shot light and shade arrays through the TAC harness (mise run probe-light -- --ticks 10,150,273,448)"
run = "uv run python python/scripts/probe_playone_light.py"

[tasks.flm-events]
description = "Dump the film-level events of one .FLM film (mise run flm-events -- corpus/.../CTRY.FLM [--sounds])"
run = "uv run python python/scripts/flm_events.py"

[tasks.adversarial]
description = "Adversarial stress suite over the formats catalog's constraints and claims"
run = "uv run python python/scripts/adversarial_formats_challenge.py"

# Development & Quality Assurance Tasks
[tasks.lint-rust]
description = "Run Rust Clippy lints across all crates"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
# Check-profile artifacts live in their own target directory so the clippy lane and the
# build-profile test lane can compile at the same time instead of queueing on one lock.
env = { CARGO_HOME = "{{config_root}}/.cache/cargo", CARGO_TARGET_DIR = "{{config_root}}/target/check" }

[tasks.lint-py]
description = "Run Ruff linter on Python codebase"
run = "uv run ruff check ."

[tasks.lint]
description = "Run all Rust and Python linters"
depends = ["lint-rust", "lint-py"]

[tasks.fmt-rust]
description = "Format Rust source files"
run = "cargo fmt"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.fmt-py]
description = "Format Python source files"
run = "uv run ruff format"

[tasks.fmt]
description = "Format all Rust and Python code"
depends = ["fmt-rust", "fmt-py"]

[tasks.fmt-check-rust]
description = "Check Rust formatting"
run = "cargo fmt --check"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.fmt-check-py]
description = "Check Python formatting"
run = "uv run ruff format --check ."

[tasks.fmt-check]
description = "Verify all code formatting"
depends = ["fmt-check-rust", "fmt-check-py"]

[tasks.typecheck]
description = "Run Python static type checking (mypy)"
run = "uv run mypy"

[tasks.test-rust]
description = "Run Rust unit and integration tests"
run = "cargo test --locked --workspace --all-features"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.test-render]
description = "Run stunt-render's GPU integration tests with a bounded hang watchdog (detects hangs instead of waiting forever)"
run = "uv run python python/scripts/watch_render_test.py"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.cov-rust]
description = "Line coverage for the Rust format crates (stunt-core, stunt-gltf)"
run = "cargo llvm-cov --locked -p stunt-core -p stunt-gltf --all-features --summary-only"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.test-py]
description = "Run Python pytest suite"
run = "uv run pytest"

[tasks.test]
description = "Run all test suites (Rust & Python)"
depends = ["test-rust", "test-py"]

[tasks.deny]
description = "Check dependency advisories, licenses, and sources"
run = "cargo deny check"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.doc]
description = "Build rustdoc with warnings denied"
run = "cargo doc --workspace --no-deps --all-features"
env = { RUSTDOCFLAGS = "-D warnings", CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.check-rust-matrix]
description = "Test stunt-core without optional features, in a target directory of its own"
# cargo test also builds the plain library for the integration tests, so the old
# `cargo check` prefix compiled the same no-default-features library a second time for no extra
# coverage. The private directory keeps this build from invalidating the all-features
# artifacts in target/ and lets it run beside the other lanes.
run = "cargo test -p stunt-core --no-default-features"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo", CARGO_TARGET_DIR = "{{config_root}}/target/matrix" }

[tasks.cov-py]
description = "Run Python test suite with coverage reporting"
run = "uv run pytest --cov=stunt_reel --cov-report=term-missing"

# The three gate tasks dispatch one script (ADR 0014; lanes: ADR 0016). The step list is the
# leaf tasks in python/scripts/gate.py, so the halves cannot run a shorter gate than the whole,
# and every step there needs a lane in STEP_LANES or the gate refuses to start.
[tasks.check-rust]
description = "Rust half of the gate (fmt, clippy, test, doc, no-default-features matrix), one line per step"
run = "python python/scripts/gate.py rust"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }

[tasks.check-py]
description = "Python half of the gate (fmt, lint, mypy, pytest), one line per step"
run = "python python/scripts/gate.py py"

[tasks.check]
description = "Full quality gate: one line per step, PASS/FAIL verdict, full log in target/check.log"
run = "python python/scripts/gate.py all"

[tasks.check-windows]
description = "Windows non-GPU half of the gate (fmt, lint, typecheck, Rust and Python tests; GPU tests skip without a driver)"
depends = ["fmt-check", "lint", "typecheck", "test"]

# The Windows-only behaviour is all in the Python tree — junctions, reparse points, the
# .cache link, the pytest basetemp workaround — so the pull-request job runs this instead of
# the whole check-windows; the full task stays on main. A test that starts depending on
# Windows path semantics belongs in this list too.
[tasks.check-windows-smoke]
description = "Windows-only smoke: the tests that exercise junctions, reparse points and .cache links"
run = "uv run pytest tests/test_dataroot.py tests/test_worktree_layout.py tests/test_worktree_reap.py tests/test_pytest_basetemp.py"

[tasks.verify-corpus]
description = "Compile research/formats/**/*.ksy and check them against local corpus/ files (opt-in; corpus is gitignored)"
run = "uv run python python/scripts/verify_schemas_corpus.py"

[tasks.sod-census]
description = "Census of corpus .SOD models that stop on unimplemented opcodes, joined to the films placing them (opt-in; corpus is gitignored; mise run sod-census -- [--format markdown])"
run = "cargo run --release --locked -p stunt-cli --bin stuntreel -- sod-census"
env = { CARGO_HOME = "{{config_root}}/.cache/cargo" }
